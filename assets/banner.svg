<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2a1015"/>
      <stop offset="45%" stop-color="#1a0d10"/>
      <stop offset="100%" stop-color="#0a0608"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a3d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6a3d" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff6a3d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- decorative low-opacity shapes -->
  <g opacity="0.12" stroke="#ff8a5c" fill="none">
    <circle cx="150" cy="80" r="60"/>
    <circle cx="1080" cy="300" r="90"/>
    <line x1="0" y1="60" x2="200" y2="10"/>
    <line x1="1000" y1="340" x2="1200" y2="290"/>
  </g>

  <g opacity="0.08" fill="#ffffff">
    <polygon points="60,300 90,260 120,300"/>
    <polygon points="1050,50 1090,10 1130,50"/>
  </g>

  <line x1="80" y1="120" x2="1120" y2="120" stroke="url(#glow)" stroke-width="1" opacity="0.5"/>

  <text x="600" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="60.0" fill="#ffffff" font-weight="bold">
    <tspan x="600" dy="0">War Tycoon Script</tspan>
  </text>

  <text x="600" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Windows tool for War Tycoon players — organizes script setup so you</tspan>
    <tspan x="600" dy="28">can jump into a match faster.</tspan>
  </text>

  <line x1="80" y1="280" x2="1120" y2="280" stroke="url(#glow)" stroke-width="1" opacity="0.3"/>
</svg>